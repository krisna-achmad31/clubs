name: klubby
description: "Klubby - main bareng, makin seru."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State management, DI & navigation
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.1.1

  # UI
  google_fonts: ^9.0.0
  intl: ^0.20.3
  lottie: ^3.6.1
  lucide_icons_flutter: ^4.0.1
  qr_flutter: ^4.1.0

  # Sensors, device & platform services
  flutter_local_notifications: ^22.3.2
  gal: ^2.3.3
  geolocator: ^14.1.2
  health: ^13.3.2
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2
  permission_handler: ^13.0.2
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  watch_connectivity: ^0.2.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/mascots/head/
    - assets/mascots/body/
    - assets/avatars/
    - assets/icons/
    - assets/lottie/
